services:
  ev1ia:
    build:
      context: .
      dockerfile: ./Dockerfile
    expose:
      - "8080"
    env_file:
      - .env
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ev1ia
    restart: unless-stopped
